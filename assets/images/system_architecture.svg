<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="40" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">SMART GREENHOUSE IoT SYSTEM ARCHITECTURE</text>
  <text x="480" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">End-to-End Real-Time Telemetry &amp; Actuation Pipeline</text>

  <!-- Layer 1: Sensors (Perception Layer) -->
  <g id="layer_sensors" transform="translate(30, 95)">
    <rect width="200" height="340" rx="10" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="32" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">PERCEPTION LAYER</text>
    <text x="100" y="48" fill="#64748b" font-size="10" text-anchor="middle">Environmental Sensors</text>

    <!-- DHT11 -->
    <rect x="15" y="70" width="170" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="100" y="93" fill="#22d3ee" font-size="11" font-weight="bold" text-anchor="middle">DHT11 Sensor</text>
    <text x="100" y="108" fill="#94a3b8" font-size="9" text-anchor="middle">Temp (°C) &amp; Humidity (%)</text>

    <!-- Soil Sensor -->
    <rect x="15" y="132" width="170" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="100" y="155" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Soil Moisture Probe</text>
    <text x="100" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">Resistive Soil VWC (%)</text>

    <!-- LDR -->
    <rect x="15" y="194" width="170" height="52" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="100" y="217" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">LDR Photoresistor</text>
    <text x="100" y="232" fill="#94a3b8" font-size="9" text-anchor="middle">Sunlight / Ambient Lux</text>

    <!-- Ultrasonic -->
    <rect x="15" y="256" width="170" height="52" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="100" y="279" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">HC-SR04 Ultrasonic</text>
    <text x="100" y="294" fill="#94a3b8" font-size="9" text-anchor="middle">Proximity / Intrusion (cm)</text>
  </g>

  <!-- Arrow from Sensors to Processing Layer -->
  <line x1="230" y1="265" x2="275" y2="265" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Edge Controller Layer -->
  <g id="layer_controller" transform="translate(280, 95)">
    <rect width="190" height="340" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="95" y="32" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">EDGE CONTROLLER</text>
    <text x="95" y="48" fill="#64748b" font-size="10" text-anchor="middle">ESP8266 NodeMCU</text>

    <rect x="15" y="75" width="160" height="110" rx="8" fill="url(#edgeGrad)"/>
    <text x="95" y="105" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Tensilica 32-bit</text>
    <text x="95" y="125" fill="#d1fae5" font-size="10" text-anchor="middle">• ADC Normalization</text>
    <text x="95" y="142" fill="#d1fae5" font-size="10" text-anchor="middle">• Distance Calculation</text>
    <text x="95" y="160" fill="#d1fae5" font-size="10" text-anchor="middle">• Threshold Evaluation</text>

    <!-- Local Actuators inside Edge Node -->
    <text x="95" y="215" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">LOCAL ALERTS</text>
    
    <rect x="15" y="228" width="160" height="42" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
    <text x="95" y="247" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle">🚨 Moisture Alert LED</text>
    <text x="95" y="260" fill="#94a3b8" font-size="9" text-anchor="middle">Triggers when Soil &lt; 25%</text>

    <rect x="15" y="278" width="160" height="42" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <text x="95" y="297" fill="#f472b6" font-size="10" font-weight="bold" text-anchor="middle">🔊 Intruder Buzzer</text>
    <text x="95" y="310" fill="#94a3b8" font-size="9" text-anchor="middle">Triggers when Dist &lt;= 30cm</text>
  </g>

  <!-- Arrow from Edge Controller to Network / Cloud -->
  <g>
    <line x1="470" y1="165" x2="515" y2="165" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="492" y="155" fill="#34d399" font-size="9" font-family="monospace" text-anchor="middle">Wi-Fi</text>
  </g>

  <!-- Layer 3: Cloud IoT Platform -->
  <g id="layer_cloud" transform="translate(520, 95)">
    <rect width="190" height="340" rx="10" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="95" y="32" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">CLOUD IoT BROKER</text>
    <text x="95" y="48" fill="#64748b" font-size="10" text-anchor="middle">Blynk Cloud 2.0</text>

    <rect x="15" y="75" width="160" height="90" rx="8" fill="url(#cloudGrad)"/>
    <text x="95" y="105" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Blynk Server</text>
    <text x="95" y="125" fill="#e0f2fe" font-size="10" text-anchor="middle">• Virtual Pins (V1-V6)</text>
    <text x="95" y="142" fill="#e0f2fe" font-size="10" text-anchor="middle">• Real-Time Datastreams</text>

    <rect x="15" y="180" width="160" height="65" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
    <text x="95" y="202" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Events &amp; Webhooks</text>
    <text x="95" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">• Push Notification Event</text>
    <text x="95" y="233" fill="#94a3b8" font-size="9" text-anchor="middle">• Alert Logging Engine</text>

    <rect x="15" y="255" width="160" height="65" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
    <text x="95" y="278" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Historical Logging</text>
    <text x="95" y="295" fill="#94a3b8" font-size="9" text-anchor="middle">• Telemetry Storage</text>
    <text x="95" y="308" fill="#94a3b8" font-size="9" text-anchor="middle">• Trends &amp; Aggregates</text>
  </g>

  <!-- Arrow from Cloud to Client UI -->
  <g>
    <line x1="710" y1="265" x2="755" y2="265" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="732" y="255" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">SSL/TLS</text>
  </g>

  <!-- Layer 4: Client Presentation Layer -->
  <g id="layer_ui" transform="translate(760, 95)">
    <rect width="170" height="340" rx="10" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="85" y="32" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">CLIENT APPS</text>
    <text x="85" y="48" fill="#64748b" font-size="10" text-anchor="middle">Mobile &amp; Web</text>

    <rect x="15" y="75" width="140" height="105" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="85" y="100" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">Blynk Mobile App</text>
    <text x="85" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">• Live Gauge Widgets</text>
    <text x="85" y="138" fill="#94a3b8" font-size="9" text-anchor="middle">• Push Alerts</text>
    <text x="85" y="156" fill="#94a3b8" font-size="9" text-anchor="middle">• History Charts</text>

    <rect x="15" y="195" width="140" height="125" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="85" y="222" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">Blynk Web Console</text>
    <text x="85" y="244" fill="#94a3b8" font-size="9" text-anchor="middle">• Real-Time Analytics</text>
    <text x="85" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">• Device Health Status</text>
    <text x="85" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">• Cloud Event History</text>
    <text x="85" y="298" fill="#94a3b8" font-size="9" text-anchor="middle">• Multi-user Sharing</text>
  </g>
</svg>
